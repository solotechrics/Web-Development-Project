<!DOCTYPE html>
<html>

<head>
  <title>CSS Positioning Exercise</title>
  <style>
    /* Write your code here */
    .blue-box {
      background-color: blue;
      width: 500px;
      height: 300px;
      position: relative;
      top: 10px;
      left: 200px;
    }

    .circle {
      width: 150px;
      height: 150px;
      background-color: red;
      border-radius: 50%;
      position: absolute;
      top: 30px;
      left: 330px;
    }

    .blue-box :nth-last-child(2) {
      background-color: green;
      position: absolute;
      z-index: 1;
      left: 20px;
      top: 30px;
    }

    .blue-box :nth-child(3){
      background-color: white;
      top: 190px;
      left: 155px;
      height: 50px;
      width: 200px;
      border-radius: 30px;
    }
  </style>
</head>

<body>
  <div class="blue-box">
    <div class="circle">
    </div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>

</body>

</html>
